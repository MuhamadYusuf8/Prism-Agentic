# =============================================================================
# docker-compose.prod.yml — PRISM Production Configuration
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Prerequisites:
#   - Create a .env.prod file with all required secrets (see .env.example)
#   - Build frontend production bundle before deploying
# =============================================================================

services:
  # ─── PostgreSQL (production hardened) ─────────────────────────────────────
  postgres:
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: []           # No external port exposure in production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M

  # ─── Redis (production hardened) ──────────────────────────────────────────
  redis:
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports: []           # No external port exposure in production
    deploy:
      resources:
        limits:
          memory: 256M

  # ─── FastAPI Backend (production mode) ────────────────────────────────────
  backend:
    restart: always
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DEBUG: "false"
    ports: []           # Exposed via Nginx only
    volumes: []         # No bind mount in production — use image
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --workers 4
      --proxy-headers
      --forwarded-allow-ips='*'
    deploy:
      resources:
        limits:
          memory: 1G
      replicas: 1

  # ─── Celery Worker (production) ──────────────────────────────────────────
  worker:
    restart: always
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes: []
    command: >
      celery -A app.core.celery_app worker
      --loglevel=warning
      --concurrency=4
      --max-tasks-per-child=100
    deploy:
      resources:
        limits:
          memory: 512M

  # ─── Celery Beat (production) ────────────────────────────────────────────
  beat:
    restart: always
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes: []

  # ─── Frontend (pre-built static via Nginx) ───────────────────────────────
  frontend:
    # In production, frontend is served as static files via Nginx.
    # Build the frontend first: cd frontend && npm run build
    # Then Nginx serves /dist directly — no Node.js runtime needed.
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod   # Multi-stage: build + nginx:alpine
    restart: always
    ports: []
    volumes: []
    environment: {}

  # ─── Nginx (production SSL termination) ───────────────────────────────────
  nginx:
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro        # Mount SSL certs (Let's Encrypt)
      - ./frontend/dist:/usr/share/nginx/html:ro  # Serve built frontend

  # ─── Adminer: DISABLED in production ─────────────────────────────────────
  adminer:
    profiles:
      - debug    # Only start if: docker compose --profile debug up adminer
